name: Sync timetable

on:
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-timetable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and encrypt timetable snapshot
        run: node .github/sync-schedule.mjs
        env:
          API_URL: ${{ secrets.API_URL }}
          TEACHER_ID: ${{ secrets.TEACHER_ID }}
          CACHE_PASSPHRASE: ${{ secrets.CACHE_PASSPHRASE }}
          EXTRA_DAYS: '15'

      - name: Commit encrypted snapshot
        run: |
          test -f data/schedule.enc
          git config user.name "timetable-bot"
          git config user.email "46679777+819024509@users.noreply.github.com"
          git add data/schedule.enc
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update encrypted timetable snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
